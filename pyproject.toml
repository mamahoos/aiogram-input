[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiogram-input"
version = "4.0.0"
description = "Await user replies in aiogram bots with Dispatcher-scoped setup and pluggable storage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "mamahoos", email = "m4m4hoos@gmail.com" },
]
keywords = [
    "aiogram",
    "telegram",
    "bot",
    "input",
    "await",
    "timeout",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "aiogram>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/mamahoos/aiogram-input"
Repository = "https://github.com/mamahoos/aiogram-input"
Issues = "https://github.com/mamahoos/aiogram-input/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
